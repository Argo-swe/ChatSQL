name: Build Artifact 
run-name: Build Artifact on PR Merge

# Trigger: pull request sul main o sul develop
on:
  push:
    branches: 
      - feature-update-workflow

# Unità di lavoro all'interno del workflow
jobs:
  build:

    # Esecuzione in ambiente Ubuntu con le ultime versioni di pacchetti e librerie
    runs-on: ubuntu-latest

    # Azioni atomiche eseguite in sequenza all'interno del job
    steps:

    # Clonazione del repository all'interno dell'ambiente di esecuzione del job
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
          # Recupero tutta la cronologia (branch e tag)
          fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
          node-version: '20'

    - name: Check Node Version
      run: node -v

    - name: Installing Dependencies
      run: |
        cd frontend
        npm i

    - name: Code Linting and Formatting (backend)
      run: |
        cd frontend
        sh ../setup-pre-commit.sh && pre-commit run --all-files

    - name: Build FrontEnd
      continue-on-error: true
      run: |
        cd frontend
        npm run build

    - name: Code Linting (frontend)
      run: |
        cd frontend
        npm run lint

    - name: Code Formatting (frontend)
      run: |
        cd frontend
        cd src 
        cat main.ts
        cd ..
        npm run format

    - name: Commit and push changes
      run: |
        cd frontend
        git config --global user.name 'github-actions'
        git config --global user.email 'argo.unipd@gmail.com'
        git add .
        git commit -m "Apply code formatting"
        git push origin HEAD:${{ github.head_ref }}
    
    - name: Build Unit Test (frontend)
      run: |
        cd frontend
        npm run test

    - name: Commit files
      run: |
        git status
        git add .

    # Creazione della directory principale
    - name: Parent Folder
      continue-on-error: true
      run: |
        mkdir -p ChatSQL/MVP
        shopt -s extglob
        cp -r !(ChatSQL) ChatSQL/MVP/

    # Pubblicazione dell'artefatto generato durante il processo di build
    - name: Publish Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChatSQL
        path: ChatSQL
